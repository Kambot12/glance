[project]
name = "glance"
version = "0.1.0"
description = "Hotkey-driven screen capture -> vision model -> streaming local web view"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.54",
    "openai>=2.0",
    "pillow>=11.0",
    "imagehash>=4.3",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "qrcode>=8.0",
    "mss>=10.0",
    "pynput>=1.8",
]

[project.optional-dependencies]
hud = ["PyQt6>=6.7"]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.20"]
sck = ["pyobjc-framework-ScreenCaptureKit>=13.1; sys_platform == 'darwin'"]
windows = ["dxcam>=0.0.5; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glance"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:glance.*"]
testpaths = ["tests"]
